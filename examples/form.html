<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jun-ui Form</title>
    <script type="module" src="https://jspm.dev/@spectrum-web-components/bundle/elements.js"></script>
    <link rel="stylesheet" href="../jun-ui.css">
    <script type="module" src="../jun-ui.js"></script>
  </head>
  <body>
    <sp-theme system="spectrum" color="light" scale="medium">
      <jui-app-shell width="narrow">
        <jui-page-header heading="Workspace Settings" subheading="Defaults for static pages and local tools">
          <sp-button slot="actions" variant="accent">Save</sp-button>
        </jui-page-header>

        <jui-panel>
          <jui-section-title heading="Design System" subheading="Choose the page foundation before writing custom CSS"></jui-section-title>
          <jui-stack>
            <sp-textfield label="Library name" value="jun-ui"></sp-textfield>
            <sp-picker label="Base component system">
              <sp-menu-item selected>Spectrum Web Components</sp-menu-item>
              <sp-menu-item>Web Awesome</sp-menu-item>
              <sp-menu-item>Bootstrap fallback</sp-menu-item>
            </sp-picker>
            <sp-switch checked>No-build by default</sp-switch>
          </jui-stack>
        </jui-panel>

        <jui-panel tone="muted">
          <jui-section-title heading="Guidance" subheading="Use page patterns first, then add page-specific CSS only where needed"></jui-section-title>
        </jui-panel>
      </jui-app-shell>
    </sp-theme>
  </body>
</html>
