<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jun-ui Dashboard</title>
    <script type="module" src="https://jspm.dev/@spectrum-web-components/bundle/elements.js"></script>
    <link rel="stylesheet" href="../jun-ui.css">
    <script type="module" src="../jun-ui.js"></script>
  </head>
  <body>
    <sp-theme system="spectrum" color="light" scale="medium">
      <jui-app-shell>
        <jui-page-header heading="Project Console" subheading="Overview, blockers, and next actions">
          <sp-button slot="actions" variant="secondary">Export</sp-button>
          <sp-button slot="actions" variant="accent">New Item</sp-button>
        </jui-page-header>

        <jui-grid>
          <jui-panel>
            <jui-stat label="Active" value="18" note="4 need attention"></jui-stat>
          </jui-panel>
          <jui-panel>
            <jui-stat label="Ready" value="7" note="Validated this week"></jui-stat>
          </jui-panel>
          <jui-panel>
            <jui-stat label="Blocked" value="2" note="Owner decision needed"></jui-stat>
          </jui-panel>
        </jui-grid>

        <jui-panel>
          <jui-section-title heading="Priority Queue" subheading="Work ordered by impact and urgency"></jui-section-title>
          <ul class="jui-list">
            <li>
              <strong>Finalize static UI library</strong>
              <div class="jui-meta"><span>Design system</span><span>Today</span></div>
            </li>
            <li>
              <strong>Publish public repository</strong>
              <div class="jui-meta"><span>GitHub</span><span>Next</span></div>
            </li>
            <li>
              <strong>Update global memory rule</strong>
              <div class="jui-meta"><span>Codex defaults</span><span>After publish</span></div>
            </li>
          </ul>
        </jui-panel>
      </jui-app-shell>
    </sp-theme>
  </body>
</html>
